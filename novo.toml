[package]
name        = "matchers-nv"
version     = "0.1.0"
description = "Hamcrest's shape for novo-lang: a Matcher over a value that says what it expected and what it found, the combinators that build one out of others, and an assert_that whose failure reads as a sentence rather than as `expected true, got false`."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`.  A matcher judges a value the caller already holds and builds
# a string.  Nothing is read and nothing is written.
#
# `assert_that` fails a test and declares no effect.  `test.fail` and
# `test.assert_false` declare none in the standard library's own
# signatures, so a function that asserts declares none either.
#
# There is no device build.  A failure message is a `Str`, and the
# embedded runtime does not link strings.
layer       = "core"

category    = "testing"

tags        = ["matchers", "hamcrest", "assert", "assertions", "testing", "combinators"]
repository  = "https://github.com/novolang/matchers-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.14.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Writing an assertion whose failure explains itself"

[dependencies]
# None.  `std.test` is the test harness and `std.regex` the regular
# expression engine, and both are part of every program.  A matcher
# prints the value it judged through `Debug`, which SPEC section 3.8.1
# gives to every struct and enum whose fields have it.
